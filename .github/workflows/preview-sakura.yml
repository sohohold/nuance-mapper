name: Deploy Preview to Sakura AppRun

# 同一リポジトリのPRごとにプレビューを作成する。同時作成数は最大4件。
on:
  # workflowはbase branch版を使い、PRコードは資格情報なしのbuild contextに限定する。
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

# PR単位で作成と削除を直列化し、新しいpushでは古いビルドを中止する。
concurrency:
  group: sakura-apprun-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # プロジェクト上限5件から本番1件を除いた数。
  MAX_PREVIEW_APPS: "4"
  PREVIEW_APP_PREFIX: nuance-mapper-pr-
  IMAGE_REPO: nuance-mapper
  APP_SECRET_VERSION: ${{ vars.APPRUN_SECRET_VERSION }}

jobs:
  preview:
    # repository secretsを渡せないforkとDependabotのPRは対象外にする。
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # AppRun定義とスクリプトにはbase branch版を使用する。
      - uses: actions/checkout@v6

      # PRコードにはcheckout tokenやデプロイ資格情報を渡さない。
      - uses: actions/checkout@v6
        with:
          path: preview-source
          persist-credentials: false
          # 検証するrevisionと一致させるため、PRのHEADを取得する。
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve names
        id: names
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REVISION="${HEAD_SHA:0:7}"
          {
            echo "app_name=${PREVIEW_APP_PREFIX}${PR_NUMBER}"
            echo "revision=${REVISION}"
            echo "tag=pr-${PR_NUMBER}-${REVISION}"
          } >> "$GITHUB_OUTPUT"

      # 認証情報が不足した状態で公開しないよう、デプロイ前に確認する。
      - name: Require preview credentials
        env:
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          PREVIEW_BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
        run: |
          if [ -z "$PREVIEW_BASIC_AUTH_USER" ] || [ -z "$PREVIEW_BASIC_AUTH_PASSWORD" ]; then
            echo "::error::PREVIEW_BASIC_AUTH_USER と PREVIEW_BASIC_AUTH_PASSWORD を Secrets に登録してください。未設定のままではプレビューが公開されます。"
            exit 1
          fi

      # versionを省略するとCLIのダウンロードに失敗する。
      - uses: fujiwara/apprun-cli@v0
        with:
          version: v0.8.1

      - name: Check preview capacity
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: |
          # 一覧取得の失敗を0件として扱わず、作成可能数を判定できない場合は停止する。
          if ! apps=$(apprun-cli list); then
            echo "::error::AppRunのアプリ一覧を取得できませんでした。作成可能数を判断できないので中断します。"
            exit 1
          fi

          # 1行1オブジェクトの出力を配列に変換する。
          if ! names=$(printf '%s' "$apps" | jq -s --arg p "$PREVIEW_APP_PREFIX" \
            '[.[] | select(.name | startswith($p)) | .name]'); then
            echo "::error::AppRunのアプリ一覧を解釈できませんでした。"
            exit 1
          fi
          echo "既存のプレビュー: $names"

          if echo "$names" | jq -e --arg n "$APP_NAME" 'index($n)' > /dev/null; then
            echo "このPRのアプリは既にあるため更新します（アプリ数は増えません）"
            exit 0
          fi

          count=$(echo "$names" | jq 'length')
          if [ "$count" -ge "$MAX_PREVIEW_APPS" ]; then
            echo "::error::プレビュー環境が上限に達しています（${count}/${MAX_PREVIEW_APPS}）。不要なPRを閉じてプレビューを削除してください。"
            exit 1
          fi

      # 既存アプリのsecretを先に同期する。新規作成またはUnHealthyの場合は延期する。
      - name: Sync existing preview secrets before deploy
        id: secrets-before
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          APPRUN_SECRET_SYNC_DEFER_IF_UNHEALTHY: "true"
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: bash .github/scripts/apprun-secrets.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          build-args: BUILD_REVISION=${{ steps.names.outputs.revision }}
          # mode=maxで中間ステージもGitHub Actions Cacheへ保存する。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./preview-source
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ steps.names.outputs.tag }}

      - name: Deploy to AppRun
        id: deploy
        env:
          APPRUN_CLI_APP: .github/apprun/preview.jsonnet
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PREVIEW_APP_NAME: ${{ steps.names.outputs.app_name }}
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          PREVIEW_BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: |
          # 不正なイメージ参照でデプロイしないようdigestを確認する。
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::ビルドしたイメージのdigestを取得できませんでした"
            exit 1
          fi

          export PREVIEW_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_REPO}@${IMAGE_DIGEST}"

          # 通常envには非機密値だけを入れ、パスワードはデプロイ後にsecretへ同期する。
          # 同期完了まではPREVIEW_AUTH_REQUIREDにより503を返す。
          PREVIEW_ENV_JSON=$(jq -n -c '
            [
              {key: "PREVIEW_BASIC_AUTH_USER",     value: $ENV.PREVIEW_BASIC_AUTH_USER},
              {key: "PREVIEW_AUTH_REQUIRED",       value: "true"},
              {key: "APP_SECRET_VERSION",          value: $ENV.APP_SECRET_VERSION}
            ] | map(select(.value != null and .value != ""))')
          export PREVIEW_ENV_JSON

          apprun-cli deploy
          # 以降の失敗時に削除できるよう、AppRunへの反映直後に記録する。
          echo "published=true" >> "$GITHUB_OUTPUT"

          # URL取得の終了状態と空値を個別に確認する。
          url=$(apprun-cli url)
          if [ -z "$url" ]; then
            echo "::error::デプロイ後の公開URLを取得できませんでした"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "image=$PREVIEW_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Sync preview secrets after deploy
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          APPRUN_SECRET_SYNC_FORCE: ${{ steps.secrets-before.outputs.deferred }}
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: bash .github/scripts/apprun-secrets.sh

      - name: Verify the deployment
        id: verify
        env:
          EXPECTED_REVISION: ${{ steps.names.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # 起動とバージョン切り替えには時間がかかるため、期待revisionまで再試行する。
          # 切り替え中は旧バージョンも応答するため、HTTP成功だけでは完了としない。
          check_gate() {
            label=$1
            mode=$2
            shift 2

            if ! status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$@"); then
              if [ "$mode" = "required" ]; then
                echo "::error::${label}へ到達できず、保護状態を確認できませんでした"
                exit 1
              fi
              return
            fi

            case "$status" in
              401) ;;
              502|503|504)
                if [ "$mode" = "required" ]; then
                  echo "::error::${label}の認証を確認できません（HTTP ${status}）"
                  exit 1
                fi
                ;;
              *)
                echo "::error::${label}が保護されていません（HTTP ${status}）"
                exit 1
                ;;
            esac
          }

          revision=""
          for i in $(seq 1 30); do
            # PRはproxyを変更できるため、各試行でページとAPIの認証状態を確認する。
            # 401はBasic認証が有効、503はsecret同期中、502/504は切り替え中として扱う。
            check_gate "GET /" transitional "${URL}/"
            check_gate "POST /api/generate" transitional \
              --request POST --header 'Content-Type: application/json' \
              --data '{}' "${URL}/api/generate"

            body=$(curl -sS --max-time 60 "${URL}/api/health" || true)
            revision=$(echo "$body" | jq -r '.revision // empty' 2>/dev/null || true)
            [ "$revision" = "$EXPECTED_REVISION" ] && break
            sleep 10
          done

          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::稼働中のビルドが期待と違います（expected=${EXPECTED_REVISION} actual=${revision:-応答なし}）"
            exit 1
          fi

          check_gate "GET /" required "${URL}/"
          check_gate "POST /api/generate" required \
            --request POST --header 'Content-Type: application/json' \
            --data '{}' "${URL}/api/generate"

          echo "revision=${revision} / 認証あり" >> "$GITHUB_STEP_SUMMARY"

      # secret同期または認証検証に失敗した公開済みアプリは削除する。
      # PR内のproxyは信頼境界として扱わない。
      - name: Retire a preview that was not verified
        if: >-
          always() &&
          steps.deploy.outputs.published == 'true' &&
          steps.verify.outcome != 'success'
        env:
          PREVIEW_APP_NAME: ${{ steps.names.outputs.app_name }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: |
          echo "::warning::デプロイ後の処理に失敗したため、公開済みプレビューを削除します"

          # PR内の定義に依存せず削除できるよう、最小の定義を生成する。
          cleanup_config="${RUNNER_TEMP}/apprun-preview-cleanup.jsonnet"
          printf '{ name: "%s" }\n' "$PREVIEW_APP_NAME" > "$cleanup_config"
          export APPRUN_CLI_APP="$cleanup_config"

          apprun-cli delete --force

      # 検証後に同じPRの旧タグを削除し、現在のタグだけを残す。
      # AppRunはdigest参照のため、稼働中のイメージには影響しない。
      - name: Prune superseded preview tags
        env:
          CURRENT_TAG: ${{ steps.names.outputs.tag }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source .github/scripts/dockerhub.sh

          jwt=$(dockerhub_login)
          if [ -z "$jwt" ]; then
            echo "::warning::Docker Hubへのログインに失敗したのでタグを整理できません"
            exit 0
          fi

          repo="${DOCKERHUB_USERNAME}/${IMAGE_REPO}"
          if ! tags=$(dockerhub_tags "$jwt" "$repo"); then
            echo "::warning::タグ一覧を取得できなかったので整理をスキップします"
            exit 0
          fi

          stale=$(printf '%s' "$tags" \
            | jq -r --arg p "pr-${PR_NUMBER}-" --arg current "$CURRENT_TAG" '
              .[] | select(.name | startswith($p)) | .name | select(. != $current)')

          if [ -z "$stale" ]; then
            echo "整理対象のタグなし"
            exit 0
          fi

          # shellcheck disable=SC2086
          dockerhub_delete_tags "$jwt" "$repo" $stale

      - name: Report to the pull request
        uses: actions/github-script@v8
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          IMAGE: ${{ steps.deploy.outputs.image }}
          REVISION: ${{ steps.names.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { APP_NAME, IMAGE, REVISION, URL } = process.env;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const deployment = await github.rest.repos.createDeployment({
              owner, repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview-pr-${issue_number}`,
              description: "Sakura AppRun preview",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: URL,
              description: `revision ${REVISION}`,
            });

            // 同じコメントを最新のURLとrevisionへ更新する。
            const marker = "<!-- sakura-apprun-preview -->";
            const body = [
              marker,
              "### さくらのAppRun プレビュー環境",
              "",
              `| | |`,
              `| --- | --- |`,
              `| URL | ${URL} |`,
              `| revision | \`${REVISION}\` |`,
              `| アプリ名 | \`${APP_NAME}\` |`,
              `| イメージ | \`${IMAGE}\` |`,
              `| workflow | [run ${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) |`,
              "",
              "Basic認証で保護されています。認証情報はリポジトリのSecretsを参照してください。",
              "",
              `初回アクセスはスケールゼロからの復帰で10秒ほどかかります。この環境はPRを閉じると削除されます。`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
