name: Deploy Preview to Sakura AppRun

# 同一リポジトリのPRごとにプレビュー環境を自動作成する。
# AppRunのアプリ数上限はプロジェクトあたり5で、本番が1つ使うため、同時に
# 持てるプレビューは最大4本。5本目はcapacity checkで明示的に失敗させる。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

# PRごとに直列化する。新しいpushが来たら古いビルドは打ち切ってよい。
# 削除ワークフローも同じgroupを使い、作成中のアプリを消さないようにしている。
concurrency:
  group: sakura-apprun-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # プロジェクト上限5 − 本番1。これを超えると新規プレビューは作れない。
  MAX_PREVIEW_APPS: "4"
  PREVIEW_APP_PREFIX: nuance-mapper-pr-
  IMAGE_REPO: nuance-mapper
  APP_SECRET_VERSION: ${{ vars.APPRUN_SECRET_VERSION }}

jobs:
  preview:
    # forkのコードへrepository secretsを渡さない。Dependabotもpull_requestでは
    # secretsを受け取れないため対象外にする。
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # マージ結果ではなくPRのHEADそのものをビルドする。
          # /api/health が返す revision をこのSHAと突き合わせて検証するため、
          # ビルド対象とSHAが一致している必要がある。
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve names
        id: names
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REVISION="${HEAD_SHA:0:7}"
          {
            echo "app_name=${PREVIEW_APP_PREFIX}${PR_NUMBER}"
            echo "revision=${REVISION}"
            echo "tag=pr-${PR_NUMBER}-${REVISION}"
          } >> "$GITHUB_OUTPUT"

      # 認証情報が無いままデプロイすると、プレビューが公開状態で外に出てしまう。
      # src/proxy.ts は両方が揃っている時だけ認証をかける実装なので、ここで止める。
      - name: Require preview credentials
        env:
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          PREVIEW_BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
        run: |
          if [ -z "$PREVIEW_BASIC_AUTH_USER" ] || [ -z "$PREVIEW_BASIC_AUTH_PASSWORD" ]; then
            echo "::error::PREVIEW_BASIC_AUTH_USER と PREVIEW_BASIC_AUTH_PASSWORD を Secrets に登録してください。未設定のままではプレビューが公開されます。"
            exit 1
          fi

      # version は必須。省略するとダウンロードURLのバージョン部分が空になり、
      # tar が「not in gzip format」で落ちる（アクションのinputsは required: true）。
      - uses: fujiwara/apprun-cli@v0
        with:
          version: v0.8.1

      - name: Check preview capacity
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: |
          # 一覧を取れなければ空き枠を判断できない。取得失敗を「0件」と誤認すると
          # 上限に達していても作成へ進んでしまうので、ここで止める。
          if ! apps=$(apprun-cli list); then
            echo "::error::AppRunのアプリ一覧を取得できませんでした。空き枠を判断できないので中断します。"
            exit 1
          fi

          # list は1行1オブジェクトのJSONを流すので -s でまとめる
          if ! names=$(printf '%s' "$apps" | jq -s --arg p "$PREVIEW_APP_PREFIX" \
            '[.[] | select(.name | startswith($p)) | .name]'); then
            echo "::error::AppRunのアプリ一覧を解釈できませんでした。"
            exit 1
          fi
          echo "既存のプレビュー: $names"

          if echo "$names" | jq -e --arg n "$APP_NAME" 'index($n)' > /dev/null; then
            echo "このPRのアプリは既にあるので更新する（枠は消費しない）"
            exit 0
          fi

          count=$(echo "$names" | jq 'length')
          if [ "$count" -ge "$MAX_PREVIEW_APPS" ]; then
            echo "::error::プレビュー環境の空きがありません（${count}/${MAX_PREVIEW_APPS}）。AppRunのアプリ数上限はプロジェクトあたり5で、本番が1つ使っています。不要なPRを閉じて枠を空けてください。"
            exit 1
          fi

      # 既存Previewのローテーションでは、CLIが新しい版番号を先に書くとpost-syncが
      # 同じキー集合を見て古い値を同期済みと誤認する。deploy前に更新しておく。
      # 新規作成またはUnHealthyなら延期し、post-syncを強制する出力を返す。
      - name: Sync existing preview secrets before deploy
        id: secrets-before
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          APPRUN_SECRET_SYNC_DEFER_IF_UNHEALTHY: "true"
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        run: bash .github/scripts/apprun-secrets.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          build-args: BUILD_REVISION=${{ steps.names.outputs.revision }}
          # レジストリキャッシュはDocker Hub無料枠の2GiBを圧迫するので使わない。
          # GitHub Actions Cache はリポジトリあたり10GBで、mode=max により
          # deps/builder 段まで再利用できる。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ steps.names.outputs.tag }}

      - name: Deploy to AppRun
        id: deploy
        env:
          APPRUN_CLI_APP: .github/apprun/preview.jsonnet
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PREVIEW_APP_NAME: ${{ steps.names.outputs.app_name }}
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          PREVIEW_BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        run: |
          # digestが空のまま進むと `...@` という参照でデプロイしようとして、
          # 原因の分かりにくいエラーになる。
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::ビルドしたイメージのdigestを取得できませんでした"
            exit 1
          fi

          export PREVIEW_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_REPO}@${IMAGE_DIGEST}"

          # apprun-cli v0.8.1はcomponents[].secretに未対応。通常envには非機密な
          # Basic認証ユーザー名、認証必須フラグ、ローテーション版番号だけを入れ、
          # 機密値は直後に公式APIで同期する。認証必須フラグは初期版から有効なので、
          # パスワード同期までの間や同期失敗時もproxyが503でfail-closedにする。
          PREVIEW_ENV_JSON=$(jq -n -c '
            [
              {key: "PREVIEW_BASIC_AUTH_USER",     value: $ENV.PREVIEW_BASIC_AUTH_USER},
              {key: "PREVIEW_AUTH_REQUIRED",       value: "true"},
              {key: "APP_SECRET_VERSION",          value: $ENV.APP_SECRET_VERSION}
            ] | map(select(.value != null and .value != ""))')
          export PREVIEW_ENV_JSON

          apprun-cli deploy

          # `echo "url=$(apprun-cli url)"` と書くと、URL取得が失敗しても echo が
          # 成功するため空のURLがそのまま後続へ流れ、検証ステップが的外れな
          # エラーを出す。取得を分けて明示的に確認する。
          url=$(apprun-cli url)
          if [ -z "$url" ]; then
            echo "::error::デプロイ後の公開URLを取得できませんでした"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "image=$PREVIEW_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Sync preview secrets after deploy
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          APPRUN_SECRET_SYNC_FORCE: ${{ steps.secrets-before.outputs.deferred }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        run: bash .github/scripts/apprun-secrets.sh

      - name: Verify the deployment
        env:
          EXPECTED_REVISION: ${{ steps.names.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # スケールゼロからの復帰に9秒前後かかるうえ、バージョンが健全と判定される
          # までにも時間がある。1回のcurlで判断せず繰り返す。
          #
          # 切り替え中は旧バージョンが応答し続ける（状態が「処理中」でもリクエストは
          # インスタンスに到達する）。応答があることだけを条件にすると、2回目以降の
          # デプロイで旧リビジョンを掴んだ時点で抜けてしまうので、期待する
          # リビジョンが出るまで待つ。
          revision=""
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 60 "${URL}/api/health" || true)
            revision=$(echo "$body" | jq -r '.revision // empty' 2>/dev/null || true)
            [ "$revision" = "$EXPECTED_REVISION" ] && break
            sleep 10
          done

          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::稼働中のビルドが期待と違います（expected=${EXPECTED_REVISION} actual=${revision:-応答なし}）"
            exit 1
          fi

          # 認証が実際に掛かっているか確認する。掛かっていなければ公開状態なので失敗させる。
          if ! gate=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "${URL}/"); then
            echo "::error::プレビューURLへ到達できず、保護状態を確認できませんでした"
            exit 1
          fi

          if [ "$gate" != "401" ]; then
            echo "::error::プレビューが保護されていません（GET / が ${gate} を返しました。401であるべきです）"
            exit 1
          fi

          echo "revision=${revision} / 認証あり" >> "$GITHUB_STEP_SUMMARY"

      # pushのたびに pr-<番号>-<リビジョン> が増える。PRを閉じるまで放置すると、
      # 長寿命のPRだけでDocker Hub無料枠(private 2GiB)を圧迫しうる。
      # 稼働確認が済んだ後に、このPRの古いタグを消す。AppRunはdigestで参照しており、
      # いま配っているタグは残すので、稼働中のイメージには影響しない。
      - name: Prune superseded preview tags
        env:
          CURRENT_TAG: ${{ steps.names.outputs.tag }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source .github/scripts/dockerhub.sh

          jwt=$(dockerhub_login)
          if [ -z "$jwt" ]; then
            echo "::warning::Docker Hubへのログインに失敗したのでタグを整理できません"
            exit 0
          fi

          repo="${DOCKERHUB_USERNAME}/${IMAGE_REPO}"
          if ! tags=$(dockerhub_tags "$jwt" "$repo"); then
            echo "::warning::タグ一覧を取得できなかったので整理をスキップします"
            exit 0
          fi

          stale=$(printf '%s' "$tags" \
            | jq -r --arg p "pr-${PR_NUMBER}-" --arg current "$CURRENT_TAG" '
              .[] | select(.name | startswith($p)) | .name | select(. != $current)')

          if [ -z "$stale" ]; then
            echo "整理対象のタグなし"
            exit 0
          fi

          # shellcheck disable=SC2086
          dockerhub_delete_tags "$jwt" "$repo" $stale

      - name: Report to the pull request
        uses: actions/github-script@v8
        env:
          APP_NAME: ${{ steps.names.outputs.app_name }}
          IMAGE: ${{ steps.deploy.outputs.image }}
          REVISION: ${{ steps.names.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { APP_NAME, IMAGE, REVISION, URL } = process.env;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const deployment = await github.rest.repos.createDeployment({
              owner, repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview-pr-${issue_number}`,
              description: "Sakura AppRun preview",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: URL,
              description: `revision ${REVISION}`,
            });

            // Vercel botと同様、pushのたびに同じコメントを最新URL・revisionへ更新する。
            const marker = "<!-- sakura-apprun-preview -->";
            const body = [
              marker,
              "### さくらのAppRun プレビュー環境",
              "",
              `| | |`,
              `| --- | --- |`,
              `| URL | ${URL} |`,
              `| revision | \`${REVISION}\` |`,
              `| アプリ名 | \`${APP_NAME}\` |`,
              `| イメージ | \`${IMAGE}\` |`,
              `| workflow | [run ${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) |`,
              "",
              "Basic認証で保護されています。認証情報はリポジトリのSecretsを参照してください。",
              "",
              `初回アクセスはスケールゼロからの復帰で10秒ほどかかります。この環境はPRを閉じると削除されます。`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
