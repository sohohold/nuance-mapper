name: Destroy Preview on Sakura AppRun

# PRを閉じたときにAppRunアプリとイメージタグを削除する。
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  deployments: write
  pull-requests: write

# 作成完了後に削除するため、作成ワークフローと同じgroupで直列化する。
concurrency:
  group: sakura-apprun-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  IMAGE_REPO: nuance-mapper
  PREVIEW_APP_PREFIX: nuance-mapper-pr-

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      # 閉じたPRのmerge refではなく、定義が存在するbase branchを取得する。
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Resolve names
        id: names
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "app_name=${PREVIEW_APP_PREFIX}${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # versionを省略するとCLIのダウンロードに失敗する。
      - uses: fujiwara/apprun-cli@v0
        with:
          version: v0.8.1

      - name: Delete the AppRun application
        id: delete
        env:
          APPRUN_CLI_APP: .github/apprun/preview.jsonnet
          # deleteはname以外を使わないため、残りの必須値にはダミーを渡す。
          DOCKERHUB_TOKEN: unused
          DOCKERHUB_USERNAME: unused
          PREVIEW_APP_NAME: ${{ steps.names.outputs.app_name }}
          PREVIEW_ENV_JSON: "[]"
          PREVIEW_IMAGE: docker.io/unused/unused:unused
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
        run: |
          # 一覧取得に失敗した場合は中断し、アプリを確認できた場合だけ削除する。
          # アプリが残った状態で後続のタグ削除へ進まないようにする。
          if ! apps=$(apprun-cli list); then
            echo "::error::AppRunのアプリ一覧を取得できませんでした。削除の要否を判断できないので中断します。"
            exit 1
          fi

          # 1行1オブジェクトの出力を配列に変換する。
          if ! exists=$(printf '%s' "$apps" | jq -s --arg n "$PREVIEW_APP_NAME" \
            'any(.[]; .name == $n)'); then
            echo "::error::AppRunのアプリ一覧を解釈できませんでした。削除の要否を判断できないので中断します。"
            exit 1
          fi

          if [ "$exists" != "true" ]; then
            echo "アプリ ${PREVIEW_APP_NAME} は存在しない。何もしない"
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          apprun-cli delete --force
          echo "deleted=true" >> "$GITHUB_OUTPUT"

      # アプリ削除の成功後にタグを削除し、稼働中アプリのイメージ参照を維持する。
      - name: Delete the preview image tags
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source .github/scripts/dockerhub.sh

          jwt=$(dockerhub_login)
          if [ -z "$jwt" ]; then
            echo "::warning::Docker Hubへのログインに失敗したのでタグを削除できません"
            exit 0
          fi

          repo="${DOCKERHUB_USERNAME}/${IMAGE_REPO}"
          if ! all=$(dockerhub_tags "$jwt" "$repo"); then
            echo "::warning::タグ一覧を取得できなかったのでタグを削除できません"
            exit 0
          fi

          tags=$(printf '%s' "$all" \
            | jq -r --arg p "pr-${PR_NUMBER}-" '.[] | select(.name | startswith($p)) | .name')

          if [ -z "$tags" ]; then
            echo "削除対象のタグなし"
            exit 0
          fi

          # shellcheck disable=SC2086
          dockerhub_delete_tags "$jwt" "$repo" $tags

      # 削除済みURLを表示しないよう、GitHub Deploymentも無効化する。
      - name: Deactivate the deployment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const environment = `preview-pr-${context.payload.pull_request.number}`;

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment },
            );

            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner, repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "プレビュー環境を削除しました",
              });
            }

      - name: Report to the pull request
        if: steps.delete.outputs.deleted == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- sakura-apprun-preview -->";

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (!existing) return;

            await github.rest.issues.updateComment({
              owner, repo,
              comment_id: existing.id,
              body: [
                marker,
                "### さくらのAppRun プレビュー環境",
                "",
                "削除済みです。新しいプレビューを1件作成できます。",
              ].join("\n"),
            });
