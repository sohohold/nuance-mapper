name: Deploy to Sakura AppRun

# main への push (PRのmergeを含む) で自動デプロイする。
# レジストリをDocker Hubへ移したことで常設リソースの課金が無くなり、AppRun自体も
# min_scale=0 でアイドル時は課金されないため、常時追従させても費用が増えない。
# 任意のタグをデプロイしたい場合や切り戻しのために手動起動も残す。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイ済みイメージのタグ。指定するとビルドせずそのイメージを配る（切り戻し用）。空ならコミットSHAでビルドする"
        required: false
        type: string

permissions:
  contents: read

# deploy/destroy が同じ Terraform state(terraform/apprun)を同時に触らないよう直列化する。
# B2のS3互換APIではネイティブロック(use_lockfile)の動作を保証できないため、
# GitHub Actions側のconcurrencyで確実に守る。
concurrency:
  group: sakura-apprun-terraform
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform/apprun
  TF_VERSION: "1.11.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine image tag
        id: vars
        # inputs.image_tag はユーザー入力なので、${{ }} でスクリプトに直接展開せず
        # env経由でシェル変数として渡す(シェルインジェクション対策)
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 既存タグの指定は切り戻し。ここでビルドすると、チェックアウト中の
            # ソースを指定タグへ上書きしてしまい、戻したいイメージが失われる。
            echo "tag=$IMAGE_TAG_INPUT"
            echo "build=false"
          else
            echo "tag=$GITHUB_SHA"
            echo "build=true"
          fi >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.B2_TFSTATE_BUCKET }}"
          key    = "nuance-mapper/apprun/terraform.tfstate"
          region = "${{ secrets.B2_REGION }}"
          endpoints = {
            s3 = "https://s3.${{ secrets.B2_REGION }}.backblazeb2.com"
          }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: terraform init -backend-config=backend.hcl

      - name: Log in to Docker Hub
        if: steps.vars.outputs.build == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push image
        if: steps.vars.outputs.build == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/nuance-mapper:${IMAGE_TAG}"
          # BUILD_REVISION は /api/health が返す。稼働中のインスタンスが
          # どのビルドかを外から確認できるようにするためのもの。
          docker build --build-arg "BUILD_REVISION=${IMAGE_TAG}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TF_VAR_image_namespace: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_cerebras_api_key: ${{ secrets.CEREBRAS_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_upstash_redis_rest_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TF_VAR_upstash_redis_rest_token: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          terraform apply -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Show app URL
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "$(terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"

      # mainへのpushごとにSHAタグが増え続け、Docker Hub無料枠(private 2GiB)を
      # いずれ使い切る。新しい順にKEEP_TAGS件だけ残して残りを消す。
      # 切り戻し(build=false)のときは走らせない。戻し先のタグを消しかねないため。
      - name: Prune old production image tags
        if: steps.vars.outputs.build == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # 切り戻し先として残す世代数
          KEEP_TAGS: "10"
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          jwt=$(curl -sS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
              '{username: $u, password: $p}')" | jq -r '.token // empty')

          if [ -z "$jwt" ]; then
            echo "::warning::Docker Hubへのログインに失敗したのでタグを整理できません"
            exit 0
          fi

          repo_url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/nuance-mapper"

          # 全ページを集めてから絞り込む。1ページ目だけを見ると、プレビュー用タグが
          # 上位を占めたときに後続ページの古い本番タグが整理対象から漏れる。
          tags="[]"
          next="${repo_url}/tags/?page_size=100"
          for _ in $(seq 1 20); do
            [ -z "$next" ] && break
            page=$(curl -sS -H "Authorization: JWT ${jwt}" "$next")
            tags=$(jq -c -n --argjson acc "$tags" --argjson page "$page" \
              '$acc + ($page.results // [])')
            next=$(echo "$page" | jq -r '.next // empty')
          done

          # プレビュー用の pr-* はプレビュー側のワークフローが管理するので触らない。
          # 今デプロイしたタグも、保持数の計算とは別に必ず除外する。
          stale=$(echo "$tags" | jq -r --arg keep "$KEEP_TAGS" --arg current "$IMAGE_TAG" '
            [.[] | select(.name | startswith("pr-") | not)]
            | sort_by(.last_updated) | reverse
            | .[($keep | tonumber):]
            | .[].name
            | select(. != $current)')

          if [ -z "$stale" ]; then
            echo "整理対象のタグなし（保持数: ${KEEP_TAGS}）"
            exit 0
          fi

          for tag in $stale; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT ${jwt}" "${repo_url}/tags/${tag}/")
            echo "delete ${tag} -> ${code}"
          done
