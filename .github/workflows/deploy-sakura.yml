name: Deploy to Sakura AppRun

# mainへのpushで自動デプロイし、手動実行では既存タグへの切り戻しに対応する。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイ済みイメージのタグ。指定するとビルドせずそのイメージを配る（切り戻し用）。空ならコミットSHAでビルドする"
        required: false
        type: string

permissions:
  contents: read

# B2ではuse_lockfileを利用しないため、同一stateへの操作をconcurrencyで直列化する。
concurrency:
  group: sakura-apprun-terraform
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform/apprun
  TF_VERSION: "1.11.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine image tag
        id: vars
        # ユーザー入力はシェルへ直接展開せず、環境変数で渡す。
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 既存タグへの切り戻しでは新しいイメージをビルドしない。
            echo "tag=$IMAGE_TAG_INPUT"
            echo "build=false"
          else
            echo "tag=$GITHUB_SHA"
            echo "build=true"
          fi >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.B2_TFSTATE_BUCKET }}"
          key    = "nuance-mapper/apprun/terraform.tfstate"
          region = "${{ secrets.B2_REGION }}"
          endpoints = {
            s3 = "https://s3.${{ secrets.B2_REGION }}.backblazeb2.com"
          }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: terraform init -backend-config=backend.hcl

      # apply前に機密値をsecretへ移し、Terraform stateから通常envの値を除く。
      # 新規作成またはUnHealthyの場合はapply後まで延期する。
      - name: Sync AppRun secrets before apply
        id: secrets-before
        env:
          APP_NAME: nuance-mapper
          APP_SECRET_VERSION: ${{ vars.APPRUN_SECRET_VERSION }}
          APPRUN_SECRET_SYNC_DEFER_IF_UNHEALTHY: "true"
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        run: bash .github/scripts/apprun-secrets.sh

      - name: Log in to Docker Hub
        if: steps.vars.outputs.build == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push image
        if: steps.vars.outputs.build == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/nuance-mapper:${IMAGE_TAG}"
          # /api/healthで稼働中のビルドを確認するため、revisionを埋め込む。
          docker build --build-arg "BUILD_REVISION=${IMAGE_TAG}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TF_VAR_image_namespace: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_app_secret_version: ${{ vars.APPRUN_SECRET_VERSION }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          terraform apply -auto-approve -var="image_tag=${IMAGE_TAG}"

      # 新規作成時と延期時のsecret同期を完了する。
      - name: Sync AppRun secrets after apply
        env:
          APP_NAME: nuance-mapper
          APP_SECRET_VERSION: ${{ vars.APPRUN_SECRET_VERSION }}
          # apply前に延期した場合は、版番号にかかわらず強制同期する。
          APPRUN_SECRET_SYNC_FORCE: ${{ steps.secrets-before.outputs.deferred }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        run: bash .github/scripts/apprun-secrets.sh

      - name: Show app URL
        id: app
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          app_url=$(terraform output -raw app_url)
          origin_host=${app_url#https://}
          if [ -z "$origin_host" ] || [ "$origin_host" = "$app_url" ]; then
            echo "::error::Terraform output app_url is not an HTTPS URL: $app_url"
            exit 1
          fi
          echo "url=$app_url" >> "$GITHUB_OUTPUT"
          echo "origin_host=$origin_host" >> "$GITHUB_OUTPUT"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "AppRun origin: $app_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Point production WebAccel at AppRun
        env:
          APP_ORIGIN_HOST: ${{ steps.app.outputs.origin_host }}
          EXPECTED_REVISION: ${{ steps.vars.outputs.tag }}
          SAKURA_ACCESS_TOKEN: ${{ secrets.SAKURA_ACCESS_TOKEN }}
          SAKURA_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_ACCESS_TOKEN_SECRET }}
          WEBACCEL_SITE_ID: ${{ vars.WEBACCEL_SITE_ID }}
          WEBACCEL_SUBDOMAIN: ${{ vars.WEBACCEL_SUBDOMAIN }}
          WEBACCEL_URL: ${{ vars.WEBACCEL_URL }}
        run: |
          set -euo pipefail
          : "${WEBACCEL_SITE_ID:?WEBACCEL_SITE_ID repository variable is required}"
          : "${WEBACCEL_SUBDOMAIN:?WEBACCEL_SUBDOMAIN repository variable is required}"
          : "${WEBACCEL_URL:?WEBACCEL_URL repository variable is required}"
          api_root="https://secure.sakura.ad.jp/cloud/zone/is1a/api/webaccel/1.0"
          payload=$(jq -nc --arg origin "$APP_ORIGIN_HOST" '{Site: {
            Name: "nuance-mapper-production",
            OriginType: "0",
            RequestProtocol: "1",
            OriginProtocol: "https",
            Origin: $origin,
            HostHeader: "",
            DefaultCacheTTL: -1,
            VarySupport: "0",
            NormalizeAE: "1"
          }}')

          # 有効中のサイト設定変更は412になる。オリジン変更時だけ一時無効化し、
          # 失敗時も再有効化する。
          site=$(curl --fail-with-body --silent --show-error \
            --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
            "$api_root/site/$WEBACCEL_SITE_ID")
          current_origin=$(jq -r '.Site.Origin // empty' <<<"$site")
          current_status=$(jq -r '.Site.Status // empty' <<<"$site")
          if [ "$current_origin" != "$APP_ORIGIN_HOST" ]; then
            enable_site_best_effort() {
              curl --fail-with-body --silent --show-error \
                --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
                --header "Content-Type: application/json" \
                --request PUT --data '{"Site":{"Status":"enabled"}}' \
                "$api_root/site/$WEBACCEL_SITE_ID/status" >/dev/null || true
            }
            enable_site() {
              curl --fail-with-body --silent --show-error \
                --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
                --header "Content-Type: application/json" \
                --request PUT --data '{"Site":{"Status":"enabled"}}' \
                "$api_root/site/$WEBACCEL_SITE_ID/status" >/dev/null
            }

            # 既に無効なら、412になる同値更新を省略する。
            trap enable_site_best_effort EXIT
            if [ "$current_status" != "disabled" ]; then
              curl --fail-with-body --silent --show-error \
                --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
                --header "Content-Type: application/json" \
                --request PUT --data '{"Site":{"Status":"disabled"}}' \
                "$api_root/site/$WEBACCEL_SITE_ID/status" >/dev/null
            fi

            curl --fail-with-body --silent --show-error \
              --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
              --header "Content-Type: application/json" \
              --request PUT --data "$payload" \
              "$api_root/site/$WEBACCEL_SITE_ID" >/dev/null
            enable_site
            trap - EXIT
            current_status="enabled"
          else
            echo "WebAccel origin is already current: $current_origin"
          fi

          # ステータスの同値更新も412になるため、無効な場合だけ有効化する。
          if [ "$current_status" != "enabled" ]; then
            curl --fail-with-body --silent --show-error \
              --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
              --header "Content-Type: application/json" \
              --request PUT --data '{"Site":{"Status":"enabled"}}' \
              "$api_root/site/$WEBACCEL_SITE_ID/status" >/dev/null
          fi

          revision=""
          for attempt in $(seq 1 60); do
            body=$(curl --fail --silent --show-error --max-time 60 \
              "$WEBACCEL_URL/api/health" || true)
            revision=$(jq -r '.revision // empty' <<<"$body" 2>/dev/null || true)
            [ "$revision" = "$EXPECTED_REVISION" ] && break
            sleep 5
          done
          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::WebAccel revision mismatch (expected=$EXPECTED_REVISION actual=${revision:-none})"
            exit 1
          fi

          # 期待revisionへの切り替え後にキャッシュを削除し、旧版による再生成を防ぐ。
          purge_payload=$(jq -nc --arg domain "$WEBACCEL_SUBDOMAIN" \
            '{Site: {Domain: $domain}}')
          curl --fail-with-body --silent --show-error \
            --user "$SAKURA_ACCESS_TOKEN:$SAKURA_ACCESS_TOKEN_SECRET" \
            --header "Content-Type: application/json" \
            --request POST --data "$purge_payload" \
            "$api_root/deleteallcache" >/dev/null

          echo "Public URL: $WEBACCEL_URL" >> "$GITHUB_STEP_SUMMARY"

      # 新しい本番タグをKEEP_TAGS件残す。切り戻し時は削除しない。
      - name: Prune old production image tags
        if: steps.vars.outputs.build == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # 切り戻し用に保持する世代数。
          KEEP_TAGS: "10"
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          source .github/scripts/dockerhub.sh

          jwt=$(dockerhub_login)
          if [ -z "$jwt" ]; then
            echo "::warning::Docker Hubへのログインに失敗したのでタグを整理できません"
            exit 0
          fi

          repo="${DOCKERHUB_USERNAME}/nuance-mapper"

          # pr-*と現在のデプロイタグは削除対象外にする。
          if ! tags=$(dockerhub_tags "$jwt" "$repo"); then
            echo "::warning::タグ一覧を取得できなかったので整理をスキップします"
            exit 0
          fi

          stale=$(printf '%s' "$tags" \
            | jq -r --arg keep "$KEEP_TAGS" --arg current "$IMAGE_TAG" '
              [.[] | select(.name | startswith("pr-") | not)]
              | sort_by(.last_updated) | reverse
              | .[($keep | tonumber):]
              | .[].name
              | select(. != $current)')

          if [ -z "$stale" ]; then
            echo "整理対象のタグなし（保持数: ${KEEP_TAGS}）"
            exit 0
          fi

          # shellcheck disable=SC2086
          dockerhub_delete_tags "$jwt" "$repo" $stale
