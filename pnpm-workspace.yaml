# pnpm 11 以降は package.json の "pnpm" フィールドを読まなくなったため、
# overrides などの設定はこのファイルで管理する。
# https://pnpm.io/settings
overrides:
  postcss@<8.5.10: '>=8.5.10'

# 依存パッケージのビルドスクリプトの許可設定（pnpm 11 で onlyBuiltDependencies /
# ignoredBuiltDependencies から allowBuilds に統合された）。
# pnpm 11 は未承認のビルドスクリプトがあるとインストールを失敗させるため、
# 実行しないものも明示的に false を書く必要がある。
# sharp は next の任意依存で、プリビルドバイナリで動くためビルドは不要。
allowBuilds:
  sharp: false
